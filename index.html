<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Лексика образованного человека — игра</title>
<style>
:root {
  --bg: #f7f3ec;
  --ink: #1c2b33;
  --teal: #1f5c57;
  --teal-light: #2a7a74;
  --gold: #c4a15a;
  --card: #fffdf9;
  --muted: #5e686c;
  --line: #e3d9cc;
  --red: #b54a4a;
  --green: #2d6a4f;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: "Segoe UI", system-ui, sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
}
header {
  background: #10211f;
  color: #fff;
  padding: 1.2rem 1.5rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 1rem;
}
header h1 {
  margin: 0;
  font-size: 1.4rem;
  font-weight: 600;
}
.modes {
  display: flex;
  gap: 0.5rem;
  flex-wrap: wrap;
}
.modes button, .block-btn, .action-btn {
  background: transparent;
  border: 1px solid rgba(255,255,255,0.3);
  color: #fff;
  padding: 0.5rem 1rem;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.95rem;
}
.modes button.active {
  background: var(--gold);
  color: #10211f;
  border-color: var(--gold);
}
main {
  max-width: 1100px;
  margin: 0 auto;
  padding: 1.5rem;
}
.screen { display: none; }
.screen.active { display: block; }
h2 {
  margin: 0 0 1rem;
  font-size: 1.6rem;
  color: var(--teal);
}
.blocks {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  margin-bottom: 1.2rem;
}
.block-btn {
  background: var(--card);
  color: var(--ink);
  border: 1px solid var(--line);
}
.block-btn.active {
  background: var(--teal);
  color: #fff;
  border-color: var(--teal);
}
.card-container {
  perspective: 1000px;
  max-width: 480px;
  margin: 0 auto 1.5rem;
  height: 280px;
}
.card {
  width: 100%;
  height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.5s;
  cursor: pointer;
}
.card.flipped { transform: rotateY(180deg); }
.card-face {
  position: absolute;
  width: 100%;
  height: 100%;
  backface-visibility: hidden;
  border-radius: 16px;
  padding: 1.5rem;
  display: flex;
  flex-direction: column;
  justify-content: center;
  box-shadow: 0 8px 24px rgba(0,0,0,0.08);
}
.card-front {
  background: var(--teal);
  color: #fff;
  text-align: center;
}
.card-front .word {
  font-size: 2rem;
  font-weight: 700;
  margin: 0;
}
.card-back {
  background: var(--card);
  color: var(--ink);
  transform: rotateY(180deg);
  border: 1px solid var(--line);
}
.card-back .def {
  font-size: 1.05rem;
  margin: 0 0 0.8rem;
  line-height: 1.4;
}
.card-back .ex {
  font-size: 0.95rem;
  color: var(--muted);
  font-style: italic;
  margin: 0;
}
.controls {
  display: flex;
  justify-content: center;
  gap: 0.8rem;
  flex-wrap: wrap;
}
.action-btn {
  background: var(--teal);
  color: #fff;
  border: none;
  padding: 0.7rem 1.4rem;
  font-size: 1rem;
}
.action-btn:hover { background: var(--teal-light); }
.quiz-progress {
  font-size: 0.95rem;
  color: var(--muted);
  margin-bottom: 0.5rem;
}
.quiz-score {
  font-weight: 600;
  color: var(--teal);
}
.question-box {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 1.5rem;
  margin-bottom: 1rem;
  box-shadow: 0 4px 16px rgba(0,0,0,0.05);
}
.question-text {
  font-size: 1.2rem;
  margin: 0 0 1.2rem;
  line-height: 1.45;
}
.options {
  display: grid;
  gap: 0.6rem;
}
.opt {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 0.9rem 1.1rem;
  text-align: left;
  cursor: pointer;
  font-size: 1rem;
  transition: all 0.15s;
}
.opt:hover { border-color: var(--teal); }
.opt.correct { background: #e8f5e9; border-color: var(--green); color: var(--green); }
.opt.wrong { background: #fdecea; border-color: var(--red); color: var(--red); }
.feedback {
  margin-top: 1rem;
  padding: 0.9rem;
  border-radius: 10px;
  font-size: 0.98rem;
  display: none;
}
.feedback.show { display: block; }
.feedback.ok { background: #e8f5e9; color: var(--green); }
.feedback.bad { background: #fdecea; color: var(--red); }
.pairs-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.8rem;
  max-width: 700px;
  margin: 0 auto;
}
.pair-card {
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: 12px;
  padding: 1rem;
  text-align: center;
  cursor: pointer;
  min-height: 80px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1rem;
  transition: all 0.15s;
}
.pair-card.selected { border-color: var(--teal); background: #eef6f5; }
.pair-card.matched { border-color: var(--green); background: #e8f5e9; color: var(--green); pointer-events: none; }
.pair-card.wrong { border-color: var(--red); animation: shake 0.3s; }
@keyframes shake {
  0%,100% { transform: translateX(0); }
  25% { transform: translateX(-4px); }
  75% { transform: translateX(4px); }
}
footer {
  text-align: center;
  padding: 1.5rem;
  color: var(--muted);
  font-size: 0.85rem;
}
@media (max-width: 600px) {
  .pairs-grid { grid-template-columns: 1fr; }
  header { flex-direction: column; align-items: flex-start; }
}
</style>
</head>
<body>
<header>
  <h1>Лексика образованного человека</h1>
  <div class="modes">
    <button data-mode="cards" class="active">Карточки</button>
    <button data-mode="quiz">Викторина</button>
    <button data-mode="pairs">Пары</button>
  </div>
</header>
<main>
  <section id="cards" class="screen active">
    <h2>Карточки</h2>
    <div class="blocks" id="blockBtns"></div>
    <div class="card-container">
      <div class="card" id="flipCard">
        <div class="card-face card-front">
          <p class="word" id="cardWord">—</p>
        </div>
        <div class="card-face card-back">
          <p class="def" id="cardDef">—</p>
          <p class="ex" id="cardEx">—</p>
        </div>
      </div>
    </div>
    <div class="controls">
      <button class="action-btn" id="prevBtn">← Назад</button>
      <button class="action-btn" id="flipBtn">Перевернуть</button>
      <button class="action-btn" id="nextBtn">Вперёд →</button>
    </div>
    <p style="text-align:center; color:var(--muted); margin-top:0.8rem;" id="cardCounter"></p>
  </section>

  <section id="quiz" class="screen">
    <h2>Викторина по ситуациям</h2>
    <div class="quiz-progress">Вопрос <span id="qNum">1</span> из <span id="qTotal">0</span> · Счёт: <span class="quiz-score" id="qScore">0</span></div>
    <div class="question-box">
      <p class="question-text" id="qText">—</p>
      <div class="options" id="qOptions"></div>
      <div class="feedback" id="qFeedback"></div>
    </div>
    <div class="controls">
      <button class="action-btn" id="nextQ" style="display:none;">Следующий</button>
    </div>
  </section>

  <section id="pairs" class="screen">
    <h2>Пары: слово и смысл</h2>
    <p style="text-align:center; color:var(--muted);">Найди пары. Кликаешь по карточке слева и справа.</p>
    <div class="pairs-grid" id="pairsGrid"></div>
    <div class="controls" style="margin-top:1rem;">
      <button class="action-btn" id="restartPairs">Заново</button>
    </div>
    <p style="text-align:center; margin-top:0.8rem;" id="pairsStatus"></p>
  </section>
</main>
<footer>Лексика образованного человека</footer>

let currentBlock = 1;
let cardIndex = 0;
let filtered = WORDS.filter(w => w.b === 1);

function renderBlocks() {
  const cont = document.getElementById("blockBtns");
  cont.innerHTML = "";
  BLOCKS.forEach(b => {
    const btn = document.createElement("button");
    btn.className = "block-btn" + (b.id === currentBlock ? " active" : "");
    btn.textContent = b.name;
    btn.onclick = () => {
      currentBlock = b.id;
      filtered = WORDS.filter(w => w.b === b.id);
      cardIndex = 0;
      renderBlocks();
      showCard();
    };
    cont.appendChild(btn);
  });
}

function showCard() {
  if (!filtered.length) return;
  const item = filtered[cardIndex];
  document.getElementById("cardWord").textContent = item.w;
  document.getElementById("cardDef").textContent = item.d;
  document.getElementById("cardEx").textContent = item.e;
  document.getElementById("flipCard").classList.remove("flipped");
  document.getElementById("cardCounter").textContent = `${cardIndex + 1} / ${filtered.length}`;
}

document.getElementById("flipBtn").onclick = () => {
  document.getElementById("flipCard").classList.toggle("flipped");
};
document.getElementById("flipCard").onclick = () => {
  document.getElementById("flipCard").classList.toggle("flipped");
};
document.getElementById("prevBtn").onclick = () => {
  cardIndex = (cardIndex - 1 + filtered.length) % filtered.length;
  showCard();
};
document.getElementById("nextBtn").onclick = () => {
  cardIndex = (cardIndex + 1) % filtered.length;
  showCard();
};

// Modes
document.querySelectorAll(".modes button").forEach(btn => {

    document.querySelectorAll(".modes button").forEach(b => b.classList.remove("active"));

    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));

    if (btn.dataset.mode === "quiz") startQuiz();
    if (btn.dataset.mode === "pairs") startPairs();
  };
});

// Quiz
let qIndex = 0;
let score = 0;
let shuffledQuiz = [];

function shuffle(arr) {
  return [...arr].sort(() => Math.random() - 0.5);
}

function startQuiz() {
  shuffledQuiz = shuffle(QUIZ);
  qIndex = 0;
  score = 0;
  document.getElementById("qScore").textContent = score;
  document.getElementById("qTotal").textContent = shuffledQuiz.length;
  showQuestion();
}

function showQuestion() {
  if (qIndex >= shuffledQuiz.length) {
    document.getElementById("qText").textContent = `Готово! Счёт: ${score} из ${shuffledQuiz.length}`;
    document.getElementById("qOptions").innerHTML = "";
    document.getElementById("qFeedback").className = "feedback show ok";
    document.getElementById("qFeedback").textContent = "Можно пройти ещё раз.";
    document.getElementById("nextQ").style.display = "none";
    return;
  }
  const item = shuffledQuiz[qIndex];
  document.getElementById("qNum").textContent = qIndex + 1;
  document.getElementById("qText").textContent = item.q;
  const opts = shuffle(item.opts);
  const cont = document.getElementById("qOptions");
  cont.innerHTML = "";
  opts.forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.textContent = opt;
    btn.onclick = () => answer(btn, opt, item.a);
    cont.appendChild(btn);
  });
  document.getElementById("qFeedback").className = "feedback";
  document.getElementById("qFeedback").textContent = "";
  document.getElementById("nextQ").style.display = "none";
}

function answer(btn, chosen, correct) {
  const all = document.querySelectorAll("#qOptions .opt");
  all.forEach(b => b.disabled = true);
  const fb = document.getElementById("qFeedback");
  if (chosen === correct) {
    btn.classList.add("correct");
    score++;
    document.getElementById("qScore").textContent = score;
    fb.className = "feedback show ok";
    fb.textContent = "Верно!";
  } else {
    btn.classList.add("wrong");
    all.forEach(b => { if (b.textContent === correct) b.classList.add("correct"); });
    fb.className = "feedback show bad";
    fb.textContent = `Правильно: ${correct}`;
  }
  document.getElementById("nextQ").style.display = "inline-block";
}

document.getElementById("nextQ").onclick = () => {
  qIndex++;
  showQuestion();
};

// Pairs
const PAIRS = [
  ["конформист", "подстраивается под большинство"],
  ["оппортунист", "меняет позицию ради выгоды"],
  ["имплицитный", "подразумевается, не сказано прямо"],
  ["латентный", "скрыт, ещё не проявился"],
  ["релевантный", "относится к вопросу"],
  ["репрезентативный", "отражает всю группу"],
  ["ксенофобия", "неприязнь к чужим"],
  ["глоссофобия", "страх сцены"],
  ["эвфемизм", "смягчённое выражение"],
  ["плеоназм", "лишнее повторение смысла"],
  ["пиетет", "глубокое почтение"],
  ["пафос", "возвышенный тон"]
];

let pairState = { selected: null, matched: 0 };

function startPairs() {
  const items = [];
  PAIRS.forEach(([w, d], i) => {
    items.push({text: w, id: i, type: "w"});
    items.push({text: d, id: i, type: "d"});
  });
  const shuffled = shuffle(items);
  const grid = document.getElementById("pairsGrid");
  grid.innerHTML = "";
  pairState = { selected: null, matched: 0 };
  document.getElementById("pairsStatus").textContent = "0 / " + PAIRS.length;
  shuffled.forEach(item => {
    const div = document.createElement("div");
    div.className = "pair-card";
    div.textContent = item.text;
    div.dataset.id = item.id;
    div.onclick = () => selectPair(div);
    grid.appendChild(div);
  });
}

function selectPair(el) {
  if (el.classList.contains("matched")) return;
  if (!pairState.selected) {
    el.classList.add("selected");
    pairState.selected = el;
    return;
  }
  if (pairState.selected === el) {
    el.classList.remove("selected");
    pairState.selected = null;
    return;
  }
  const first = pairState.selected;
  if (first.dataset.id === el.dataset.id) {
    first.classList.remove("selected");
    first.classList.add("matched");
    el.classList.add("matched");
    pairState.matched++;
    document.getElementById("pairsStatus").textContent = pairState.matched + " / " + PAIRS.length;
    if (pairState.matched === PAIRS.length) {
      document.getElementById("pairsStatus").textContent = "Все пары найдены!";
    }
  } else {
    el.classList.add("wrong");
    first.classList.add("wrong");
    setTimeout(() => {
      el.classList.remove("wrong", "selected");
      first.classList.remove("wrong", "selected");
    }, 600);
  }
  pairState.selected = null;
}

document.getElementById("restartPairs").onclick = startPairs;
